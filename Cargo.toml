[package]
name = "nexus_systems"
version = "1.0.0"
edition = "2021"
authors = ["1hitskillburst-rgb <1hitskillburst@gmail.com>"]
description = "NEXUS / SYSTEMS --- PC Control Center (Native Windows Desktop Telemetry Application)"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
sysinfo = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
libloading = "0.8"
windows-sys = { version = "0.52", features = [
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Power"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

